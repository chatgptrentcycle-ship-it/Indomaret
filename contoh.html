```html
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Checkout - Indomaret Online</title>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
            }

            body {
                background: #f5f5f5;
            }

            header {
                background: #ed1c24;
                padding: 15px 7%;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo {
                background: white;
                padding: 8px 15px;
                border-radius: 7px;
                font-size: 22px;
                font-weight: bold;
                color: #ed1c24;
            }

            .logo span {
                color: #ffd000;
            }

            .logo b {
                color: #0066b3;
            }

            .kembali {
                color: white;
                text-decoration: none;
                font-weight: bold;
            }

            .checkout-container {
                max-width: 600px;
                margin: 40px auto;
                background: white;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            }

            h1 {
                text-align: center;
                color: #ed1c24;
                margin-bottom: 10px;
            }

            .deskripsi {
                text-align: center;
                color: #777;
                margin-bottom: 30px;
            }

            label {
                display: block;
                font-weight: bold;
                margin-bottom: 8px;
                margin-top: 20px;
            }

            input {
                width: 100%;
                padding: 14px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
            }

            input:focus {
                border: 2px solid #ed1c24;
            }

            .checkout-btn {
                width: 100%;
                margin-top: 30px;
                padding: 15px;
                border: none;
                border-radius: 8px;
                background: #ed1c24;
                color: white;
                font-size: 17px;
                font-weight: bold;
                cursor: pointer;
            }

            .checkout-btn:hover {
                background: #c9151d;
            }

            .wajib {
                color: red;
            }

            .success {
                display: none;
                text-align: center;
                margin-top: 20px;
                padding: 15px;
                background: #e8f5e9;
                color: #198754;
                border-radius: 8px;
                font-weight: bold;
            }

            @media (max-width: 600px) {
                .checkout-container {
                    margin: 20px;
                    padding: 25px 20px;
                }

                header {
                    padding: 15px;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <div class="logo"><span>INDO</span><b>maret</b></div>

            <a href="index.html" class="kembali"> ← Kembali Belanja </a>
        </header>

        <div class="checkout-container">
            <h1>🛒 Checkout</h1>

            <p class="deskripsi">Silakan masukkan data pembeli</p>

            <form onsubmit="buatPesanan(event)">
                <label for="nama"> Nama Lengkap <span class="wajib">*</span> </label>

                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required />

                <label for="telepon"> Nomor Telepon <span class="wajib">*</span> </label>

                <input type="tel" id="telepon" placeholder="Contoh: 081234567890" pattern="[0-9]{10,13}" required />

                <button type="submit" class="checkout-btn">✅ Buat Pesanan</button>
            </form>

            <div id="success" class="success">Pesanan berhasil dibuat! 🎉</div>
        </div>

        <script>
            function buatPesanan(event) {
                event.preventDefault();

                let nama = document.getElementById('nama').value;
                let telepon = document.getElementById('telepon').value;

                alert(
                    '🎉 PESANAN BERHASIL!\n\n' +
                        'Nama: ' +
                        nama +
                        '\n' +
                        'Nomor Telepon: ' +
                        telepon +
                        '\n\n' +
                        'Terima kasih sudah berbelanja!'
                );

                document.getElementById('success').style.display = 'block';

                setTimeout(function () {
                    window.location.href = 'index.html';
                }, 2000);
            }
        </script>
    </body>
</html>
